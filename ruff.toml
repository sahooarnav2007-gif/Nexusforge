# NexusForge lint configuration (ruff).
#
# Infrastructure file: defines the project lint ruleset and grandfathers the
# *pre-existing* lint debt in individual files so CI enforces the standard on
# new/changed code without requiring a repo-wide cleanup. When you clean up a
# file, remove its entry (or the specific rule) below and the gate covers it.
#
# Ruleset: E9 (runtime/syntax errors), F (pyflakes: undefined names, unused
# imports, f-string issues), B (flake8-bugbear: real bug patterns). Style rules
# (W, I, UP, SIM, ...) are intentionally not enforced yet; run `make format` or
# `ruff check --select I,UP,W` locally if you want them.

target-version = "py311"
line-length = 100

# Runtime-generated and fixture trees are not project source.
extend-exclude = [
    "var",            # runtime DB, workspaces, audit log
    "demo/repo",      # intentionally-incomplete demo fixture
    "node_modules",
    ".next",
]

[lint]
select = ["E9", "F", "B"]

# --- Pre-existing debt, grandfathered per file (remove as files are cleaned) ---
[lint.per-file-ignores]
"api/app.py" = ["F401", "F841"]
